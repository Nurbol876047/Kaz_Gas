# Standalone config (not the Debian /etc/supervisor one) - everything here
# runs as whatever user the container itself runs as (see render.Dockerfile's
# USER app), so sockets/logs/pidfile live under /tmp rather than /var/run or
# /var/log, which a non-root user can't necessarily write to.

[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/tmp/supervisord.log
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:backend]
directory=/srv/backend
command=/usr/local/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
directory=/srv/frontend
command=/usr/local/bin/node server.js
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
directory=/srv/bot
command=/usr/local/bin/python -m bot.main
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:notifications]
directory=/srv/backend
command=/usr/local/bin/python -m app.notifications
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
