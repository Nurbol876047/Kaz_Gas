[program:backend]
directory=/srv/backend
command=/usr/local/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log
user=app
environment=HOME="/home/app"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
directory=/srv/frontend
command=/usr/local/bin/node server.js
user=app
environment=HOME="/home/app"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
directory=/srv/bot
command=/usr/local/bin/python -m bot.main
user=app
environment=HOME="/home/app"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:notifications]
directory=/srv/backend
command=/usr/local/bin/python -m app.notifications
user=app
environment=HOME="/home/app"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
